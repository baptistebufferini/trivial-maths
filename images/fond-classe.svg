<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <!-- Fond d'écran du jeu : une salle de classe (dessin vectoriel, flouté par le CSS) -->
  <defs>
    <linearGradient id="mur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d2"/>
      <stop offset="1" stop-color="#dccdb0"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8774a"/>
      <stop offset="1" stop-color="#7c5332"/>
    </linearGradient>
    <linearGradient id="tableau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36694f"/>
      <stop offset="1" stop-color="#244a37"/>
    </linearGradient>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0f2"/>
      <stop offset="1" stop-color="#dff0fb"/>
    </linearGradient>
    <linearGradient id="bureau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99a63"/>
      <stop offset="1" stop-color="#a87945"/>
    </linearGradient>
  </defs>

  <!-- Mur, plinthe et parquet -->
  <rect width="1600" height="1000" fill="url(#mur)"/>
  <rect y="760" width="1600" height="240" fill="url(#sol)"/>
  <g stroke="#6a4529" stroke-width="3" opacity=".55">
    <path d="M0 800 H1600 M0 850 H1600 M0 910 H1600 M0 975 H1600"/>
    <path d="M160 760 V800 M520 760 V800 M900 760 V800 M1290 760 V800 M330 800 V850 M720 800 V850 M1100 800 V850 M1480 800 V850 M90 850 V910 M470 850 V910 M860 850 V910 M1240 850 V910 M260 910 V975 M640 910 V975 M1030 910 V975 M1420 910 V975"/>
  </g>
  <rect y="745" width="1600" height="18" fill="#c8b48f"/>

  <!-- Horloge murale -->
  <g transform="translate(600 95)">
    <circle r="48" fill="#ffffff" stroke="#3b3b3b" stroke-width="8"/>
    <path d="M0 0 V-30 M0 0 L22 10" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <circle r="4" fill="#222"/>
  </g>

  <!-- Tableau noir (vert) avec écritures à la craie -->
  <rect x="170" y="170" width="860" height="470" rx="10" fill="#8a5a2c"/>
  <rect x="190" y="190" width="820" height="430" fill="url(#tableau)"/>
  <rect x="180" y="638" width="840" height="16" rx="4" fill="#7a4e26"/>
  <rect x="300" y="628" width="40" height="10" rx="3" fill="#f5f5f5"/>
  <rect x="360" y="630" width="30" height="8" rx="3" fill="#f2c94c"/>
  <rect x="820" y="626" width="70" height="12" rx="3" fill="#5a5a5a"/>
  <g fill="none" stroke="#f4f4ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <!-- triangle rectangle -->
    <path d="M250 560 V420 H250 M250 560 H430 L250 420"/>
    <path d="M250 540 H270 V560"/>
    <!-- cercle et rayon -->
    <circle cx="560" cy="490" r="70"/>
    <path d="M560 490 L620 455"/>
    <!-- repère et droite -->
    <path d="M720 580 V400 M700 560 H960"/>
    <path d="M730 590 L940 420" stroke="#f2c94c"/>
  </g>
  <g fill="#f4f4ec" font-family="'Segoe Print', 'Comic Sans MS', cursive" opacity=".85">
    <text x="240" y="265" font-size="46">a² + b² = c²</text>
    <text x="640" y="260" font-size="42">π ≈ 3,14</text>
    <text x="240" y="345" font-size="38">f(x) = 2x + 1</text>
    <text x="620" y="345" font-size="38">3/4 + 1/4 = 1</text>
    <text x="275" y="600" font-size="26">3</text>
    <text x="330" y="455" font-size="26">5</text>
    <text x="595" y="465" font-size="24">r</text>
  </g>

  <!-- Affiches -->
  <rect x="1080" y="200" width="150" height="200" rx="6" fill="#ffffff" stroke="#cfc2a5" stroke-width="4"/>
  <g transform="translate(1155 300)">
    <path d="M0 0 L0 -70 A70 70 0 0 1 66 22 Z" fill="#1f6fd1"/>
    <path d="M0 0 L66 22 A70 70 0 0 1 -50 49 Z" fill="#2a9d4b"/>
    <path d="M0 0 L-50 49 A70 70 0 0 1 0 -70 Z" fill="#ef7d00"/>
  </g>
  <rect x="1080" y="430" width="150" height="110" rx="6" fill="#fff8e1" stroke="#cfc2a5" stroke-width="4"/>
  <g fill="#c2185b" font-family="Arial, sans-serif" font-weight="bold" font-size="30">
    <text x="1100" y="475">1 2 3</text>
    <text x="1100" y="520">× ÷ + −</text>
  </g>

  <!-- Fenêtres -->
  <g>
    <rect x="1280" y="120" width="260" height="420" rx="6" fill="#f6f1e6"/>
    <rect x="1298" y="138" width="224" height="384" fill="url(#ciel)"/>
    <ellipse cx="1370" cy="210" rx="50" ry="20" fill="#ffffff" opacity=".9"/>
    <ellipse cx="1460" cy="300" rx="40" ry="16" fill="#ffffff" opacity=".8"/>
    <path d="M1298 470 Q1360 420 1420 470 T1522 460 V522 H1298 Z" fill="#7cc27a"/>
    <path d="M1410 138 V522 M1298 330 H1522" stroke="#f6f1e6" stroke-width="12"/>
    <rect x="1270" y="536" width="280" height="16" rx="4" fill="#e8dcc2"/>
    <!-- plante sur le rebord -->
    <path d="M1490 536 L1480 495 H1530 L1520 536 Z" fill="#c0603a"/>
    <path d="M1505 495 C1490 460 1470 450 1460 430 M1505 495 C1510 455 1530 440 1540 420 M1505 495 C1505 465 1500 445 1505 420" stroke="#3f8f45" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Bureaux d'élèves au premier plan -->
  <g>
    <path d="M60 870 L120 780 H520 L560 870 Z" fill="url(#bureau)"/>
    <rect x="70" y="870" width="490" height="22" fill="#8a5f33"/>
    <rect x="90" y="892" width="18" height="108" fill="#555"/>
    <rect x="515" y="892" width="18" height="108" fill="#555"/>
    <rect x="210" y="800" width="120" height="30" rx="3" fill="#ffffff" transform="rotate(-6 270 815)"/>
    <rect x="360" y="805" width="60" height="8" rx="3" fill="#e74c3c" transform="rotate(20 390 809)"/>
    <path d="M1040 870 L1080 780 H1480 L1540 870 Z" fill="url(#bureau)"/>
    <rect x="1040" y="870" width="500" height="22" fill="#8a5f33"/>
    <rect x="1060" y="892" width="18" height="108" fill="#555"/>
    <rect x="1500" y="892" width="18" height="108" fill="#555"/>
    <rect x="1200" y="795" width="140" height="40" rx="4" fill="#1f6fd1" transform="rotate(5 1270 815)"/>
  </g>
</svg>
